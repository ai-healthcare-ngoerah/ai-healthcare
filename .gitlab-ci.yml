# ==============================================================================
# 🌐 AI HEALTHCARE FRONTEND - GITLAB CI/CD PIPELINE
# Repository: gitlab.com:ternak-automation-group1/ternak-automation-project.git
# Active Development Branch: main
# ==============================================================================

stages:
  - lint
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Shared node_modules and npm cache across pipeline runs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/
    - node_modules/

# Global workflow rules (runs on main, master, dev-mahesta, and merge requests)
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "dev-mahesta"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# STAGE 1: LINT & STATIC CODE QUALITY CHECK
# ==============================================================================
lint_check:
  stage: lint
  image: node:20-alpine
  before_script:
    - node -v
    - npm -v
    - npm ci --prefer-offline
  script:
    - echo "🔍 Running ESLint for React components & hooks..."
    - npm run lint || echo "⚠️ Non-critical lint warnings found."
  allow_failure: true

# ==============================================================================
# STAGE 2: PRODUCTION BUILD & ASSET PACKAGING
# ==============================================================================
build_production:
  stage: build
  image: node:20-alpine
  before_script:
    - npm ci --prefer-offline
  script:
    - echo "🏗️ Building Vite production bundle (1829 modules)..."
    - npm run build
    - echo "✅ Production build succeeded! Verifying dist directory:"
    - ls -la dist/
  artifacts:
    name: "frontend-production-dist-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 7 days
    paths:
      - dist/
